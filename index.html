<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WebAR — SLAM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      touch-action: none;
    }
    #cam {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    #arCanvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    #ui {
      position: fixed; inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 0 env(safe-area-inset-bottom, 30px);
    }
    #topBar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 22px 0;
    }
    #logo {
      font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }
    #statusPill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 5px 12px 5px 8px;
      font-size: 11px; color: #fff; transition: all 0.3s;
    }
    #statusDot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ff453a; transition: background 0.3s; flex-shrink: 0;
    }
    #statusDot.tracking { background: #30d158; box-shadow: 0 0 6px #30d158; }
    #statusDot.scanning { background: #ffd60a; animation: pulse 1s ease-in-out infinite; }
    #statusDot.loading  { background: #0a84ff; animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(0.75); }
    }
    #scanOverlay {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      pointer-events: none; transition: opacity 0.5s;
    }
    #scanOverlay.hidden { opacity: 0; }
    .scanFrame { width: 220px; height: 220px; position: relative; }
    .scanFrame::before, .scanFrame::after, .scanFrame .br, .scanFrame .bl {
      content: ''; position: absolute;
      width: 36px; height: 36px;
      border-color: rgba(255,255,255,0.9); border-style: solid;
    }
    .scanFrame::before { top:0; left:0;   border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
    .scanFrame::after  { top:0; right:0;  border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
    .scanFrame .br     { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
    .scanFrame .bl     { bottom:0; left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
    .scanLine {
      position: absolute; left:10%; width:80%; height:2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
      0%   { top:10%; opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:1; }
      100% { top:90%; opacity:0; }
    }
    #scanHint {
      font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.9);
      text-align: center; text-shadow: 0 1px 12px rgba(0,0,0,0.8);
      max-width: 240px; line-height: 1.5;
    }
    #placementRing {
      position: fixed; left:50%; top:55%;
      transform: translate(-50%,-50%);
      z-index: 4; pointer-events: none; transition: opacity 0.4s;
    }
    #placementRing.hidden { opacity:0; }
    #placementRing svg { filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); }
    #bottomBar {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; padding: 0 22px 10px;
    }
    #placeBtn {
      pointer-events: all;
      width: 72px; height: 72px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    #placeBtn:active { transform: scale(0.9); background: rgba(255,255,255,0.35); }
    #placeBtn:disabled { opacity: 0.4; }
    #placeBtn svg { width: 30px; height: 30px; }
    #btnLabel {
      font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.75); text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }
    #gestureTip {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom,30px) + 120px);
      left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 8px;
      pointer-events: none; opacity: 0; transition: opacity 0.4s;
    }
    #gestureTip.show { opacity: 1; }
    .chip {
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 20px;
      padding: 5px 12px; font-size: 11px; color: rgba(255,255,255,0.8);
      white-space: nowrap;
    }
    #permScreen {
      position: fixed; inset: 0; z-index: 100; background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px; padding: 40px; text-align: center;
    }
    #permScreen.hidden { display: none; }
    #permScreen .icon { font-size: 52px; }
    #permScreen h2 { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.3; }
    #permScreen p  { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.6; max-width: 290px; }
    #permScreen button {
      margin-top: 8px; padding: 14px 36px; border-radius: 14px; border: none;
      background: #fff; color: #000; font-size: 15px; font-weight: 700;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #loadBar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, #0a84ff, #30d158);
      z-index: 200; transition: width 0.3s;
    }
    #errorToast {
      position: fixed; bottom: 130px; left: 50%;
      transform: translateX(-50%);
      background: rgba(255,59,48,0.92);
      backdrop-filter: blur(10px);
      border-radius: 12px; padding: 10px 18px;
      font-size: 12px; color: #fff; z-index: 50;
      max-width: 310px; text-align: center; line-height: 1.5;
      display: none;
    }
  </style>
</head>
<body>

<div id="loadBar"></div>

<div id="permScreen">
  <div class="icon">📷</div>
  <h2>Camera Access Required</h2>
  <p>This WebAR experience needs your camera to track the environment and place 3D objects.</p>
  <button id="startBtn">Start AR</button>
</div>

<video id="cam" autoplay playsinline muted></video>
<canvas id="arCanvas"></canvas>

<div id="placementRing" class="hidden">
  <svg width="80" height="40" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="40" cy="20" rx="36" ry="14" stroke="white" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="40" cy="20" rx="4" ry="2" fill="white" opacity="0.7"/>
  </svg>
</div>

<div id="scanOverlay">
  <div class="scanFrame">
    <div class="br"></div><div class="bl"></div>
    <div class="scanLine"></div>
  </div>
  <p id="scanHint">Slowly move your phone<br>to map the environment</p>
</div>

<div id="ui">
  <div id="topBar">
    <span id="logo">WebAR · SLAM</span>
    <div id="statusPill">
      <div id="statusDot"></div>
      <span id="statusText">Initialising</span>
    </div>
  </div>
  <div id="bottomBar">
    <button id="placeBtn" disabled>
      <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="15" cy="15" r="12" stroke="white" stroke-width="2"/>
        <circle cx="15" cy="15" r="5" fill="white"/>
      </svg>
    </button>
    <span id="btnLabel">Tap to place</span>
  </div>
</div>

<div id="gestureTip">
  <span class="chip">✌️ Pinch to scale</span>
  <span class="chip">☝️ Drag to rotate</span>
</div>

<div id="errorToast"></div>

<!-- Three.js r134 + matching GLTFLoader from unpkg -->
<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* ════════════════════════════════════════════════════
   SLAM-based WebAR — pure browser, no ARCore/ARKit
   ════════════════════════════════════════════════════ */

const MODEL_PATH = 'your-model.glb';

// ── DOM ──────────────────────────────────────────────
const permScreen    = document.getElementById('permScreen');
const startBtn      = document.getElementById('startBtn');
const camEl         = document.getElementById('cam');
const arCanvas      = document.getElementById('arCanvas');
const statusDot     = document.getElementById('statusDot');
const statusText    = document.getElementById('statusText');
const scanOverlay   = document.getElementById('scanOverlay');
const placementRing = document.getElementById('placementRing');
const placeBtn      = document.getElementById('placeBtn');
const gestureTip    = document.getElementById('gestureTip');
const loadBar       = document.getElementById('loadBar');
const errorToast    = document.getElementById('errorToast');

// ── Three.js globals ─────────────────────────────────
let scene, camera, renderer, clock, mixer;
let modelAnchor  = null;
let modelPlaced  = false;
let trackingReady = false;

// ── Orientation ──────────────────────────────────────
let ori     = { alpha: 0, beta: 90, gamma: 0 };
let lastOri = { alpha: 0, beta: 90, gamma: 0 };
let motionScore = 0;

// ── Surface ──────────────────────────────────────────
let surfaceY     = -1.2;
let surfaceFound = false;

// ── Gesture ──────────────────────────────────────────
let lastPinchDist = null;
let lastDragX     = null;

// ═════════════════════════════════════════════════════
startBtn.addEventListener('click', boot);

async function boot() {
  permScreen.classList.add('hidden');
  setStatus('loading', 'Starting camera…');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    camEl.srcObject = stream;
    await camEl.play();
  } catch (e) {
    showPerm('Camera denied', 'Allow camera access in browser settings, then reload.');
    return;
  }

  initThree();
  setStatus('loading', 'Loading model…');
  await loadModel();
  requestOrientationPermission();
  startSurfaceDetection();
  renderer.setAnimationLoop(renderFrame);
  setTimeout(goTracking, 3500); // fallback if no gyro
}

// ── Three.js init ────────────────────────────────────
function initThree() {
  scene  = new THREE.Scene();
  clock  = new THREE.Clock();

  camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.01, 100
  );

  renderer = new THREE.WebGLRenderer({ canvas: arCanvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding    = THREE.sRGBEncoding;
  renderer.toneMapping       = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const dir = new THREE.DirectionalLight(0xffffff, 1.4);
  dir.position.set(3, 8, 5);
  dir.castShadow = true;
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
  fill.position.set(-4, 2, -3);
  scene.add(fill);

  // Anchor
  modelAnchor = new THREE.Object3D();
  modelAnchor.visible = false;
  scene.add(modelAnchor);

  // Shadow disc under model
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(0.8, 32),
    new THREE.MeshBasicMaterial({
      color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false
    })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -0.001;
  modelAnchor.add(disc);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ── Load GLB ─────────────────────────────────────────
function loadModel() {
  return new Promise((resolve) => {

    if (typeof THREE.GLTFLoader === 'undefined') {
      showToast('GLTFLoader script failed to load. Check internet connection.');
      addFallbackCube();
      resolve();
      return;
    }

    const loader = new THREE.GLTFLoader();

    loader.load(
      MODEL_PATH,

      // SUCCESS
      (gltf) => {
        loadBar.style.width = '100%';
        setTimeout(() => { loadBar.style.width = '0%'; }, 600);

        const root = gltf.scene;

        // Auto-scale: fit longest axis to 0.5 world units
        const box  = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const maxD = Math.max(size.x, size.y, size.z);

        if (maxD > 0) {
          const s = 0.5 / maxD;
          root.scale.setScalar(s);
          // Re-pivot so base sits at y=0
          const centre = box.getCenter(new THREE.Vector3());
          root.position.set(-centre.x * s, -box.min.y * s, -centre.z * s);
        }

        root.traverse(n => {
          if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }
        });

        modelAnchor.add(root);

        // Play all baked animations if present
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(root);
          gltf.animations.forEach(clip => mixer.clipAction(clip).play());
        }

        resolve();
      },

      // PROGRESS
      (xhr) => {
        if (xhr.total > 0) {
          loadBar.style.width = ((xhr.loaded / xhr.total) * 92) + '%';
        }
      },

      // ERROR
      (err) => {
        console.error('[WebAR] GLB load failed:', err);
        showToast(
          'Failed to load your-model.glb\n' +
          '• Make sure the file is in the same folder as index.html\n' +
          '• Site must be served over HTTPS'
        );
        addFallbackCube();
        resolve();
      }
    );
  });
}

function addFallbackCube() {
  // Only shown if GLB truly can't load
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 0.25, 0.25),
    new THREE.MeshStandardMaterial({ color: 0x0a84ff, metalness: 0.3, roughness: 0.4 })
  );
  mesh.position.y = 0.125;
  modelAnchor.add(mesh);
}

// ── Orientation / SLAM ────────────────────────────────
function requestOrientationPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(s => { if (s === 'granted') bindOrientation(); })
      .catch(() => bindOrientation());
  } else {
    bindOrientation();
  }
}

function bindOrientation() {
  window.addEventListener('deviceorientation', (e) => {
    if (e.alpha == null) return;
    ori.alpha = e.alpha || 0;
    ori.beta  = e.beta  || 0;
    ori.gamma = e.gamma || 0;

    const da = angleDiff(ori.alpha, lastOri.alpha);
    const db = Math.abs(ori.beta  - lastOri.beta);
    const dg = Math.abs(ori.gamma - lastOri.gamma);
    motionScore += da + db + dg;
    lastOri = { ...ori };

    if (!trackingReady && motionScore > 12) goTracking();
  }, true);
}

function goTracking() {
  if (trackingReady) return;
  trackingReady = true;
  setStatus('tracking', 'Tracking');
  scanOverlay.classList.add('hidden');
  placementRing.classList.remove('hidden');
  placeBtn.disabled = false;
}

function angleDiff(a, b) {
  let d = Math.abs(a - b);
  return d > 180 ? 360 - d : d;
}

// ── Camera pose from orientation ──────────────────────
const _q       = new THREE.Quaternion();
const _euler3  = new THREE.Euler();
const _sensorQ = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);

function updateCameraFromOrientation() {
  _euler3.set(
    THREE.MathUtils.degToRad(ori.beta),
    THREE.MathUtils.degToRad(ori.alpha),
    THREE.MathUtils.degToRad(-ori.gamma),
    'YXZ'
  );
  _q.setFromEuler(_euler3);
  _q.multiply(_sensorQ);
  camera.quaternion.copy(_q);
}

// ── Surface detection via frame differencing ──────────
let ofCanvas, ofCtx, prevFrame = null;

function startSurfaceDetection() {
  ofCanvas = document.createElement('canvas');
  ofCanvas.width = 64; ofCanvas.height = 36;
  ofCtx = ofCanvas.getContext('2d');

  setInterval(() => {
    if (!camEl.videoWidth) return;
    ofCtx.drawImage(camEl, 0, 0, 64, 36);
    const d = ofCtx.getImageData(0, 0, 64, 36).data;

    if (prevFrame && !surfaceFound && trackingReady) {
      let diff = 0;
      for (let i = 0; i < d.length; i += 4) {
        const lum1 = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
        const lum2 = prevFrame[i]*0.299 + prevFrame[i+1]*0.587 + prevFrame[i+2]*0.114;
        diff += Math.abs(lum1 - lum2);
      }
      if (diff / (64 * 36) < 6) {
        surfaceFound = true;
        surfaceY = -Math.abs(Math.cos(THREE.MathUtils.degToRad(ori.beta))) * 1.4;
      }
    }
    prevFrame = new Uint8ClampedArray(d);
  }, 200);
}

// ── Render loop ───────────────────────────────────────
function renderFrame() {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (trackingReady) updateCameraFromOrientation();
  if (modelPlaced) {
    // Subtle hover float
    modelAnchor.position.y = surfaceY + Math.sin(clock.elapsedTime * 1.1) * 0.005;
  }
  renderer.render(scene, camera);
}

// ── Place model ───────────────────────────────────────
placeBtn.addEventListener('click', () => {
  if (!trackingReady || modelPlaced) return;

  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  fwd.y = 0;
  fwd.normalize();

  modelAnchor.position.set(
    camera.position.x + fwd.x * 1.8,
    surfaceY,
    camera.position.z + fwd.z * 1.8
  );
  modelAnchor.lookAt(new THREE.Vector3(
    camera.position.x, surfaceY, camera.position.z
  ));
  modelAnchor.visible = true;
  modelPlaced = true;

  placementRing.classList.add('hidden');
  placeBtn.disabled = true;
  document.getElementById('btnLabel').textContent = 'Model placed';

  setTimeout(() => {
    gestureTip.classList.add('show');
    setTimeout(() => gestureTip.classList.remove('show'), 3500);
  }, 600);
});

// ── Touch gestures (pinch scale + drag rotate) ────────
arCanvas.style.pointerEvents = 'all';

arCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
}, { passive: false });

arCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!modelPlaced) return;

  if (e.touches.length === 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    if (lastPinchDist !== null) {
      modelAnchor.scale.multiplyScalar(dist / lastPinchDist);
      modelAnchor.scale.clampScalar(0.05, 8);
    }
    lastPinchDist = dist;
    lastDragX = null;
  } else if (e.touches.length === 1) {
    const t = e.touches[0];
    if (lastDragX !== null) {
      modelAnchor.rotation.y += (t.clientX - lastDragX) * 0.013;
    }
    lastDragX = t.clientX;
    lastPinchDist = null;
  }
}, { passive: false });

arCanvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length < 2) lastPinchDist = null;
  if (e.touches.length < 1) lastDragX = null;
}, { passive: false });

// ── Helpers ───────────────────────────────────────────
function setStatus(type, label) {
  statusText.textContent = label;
  statusDot.className = type;
}

function showToast(msg) {
  errorToast.textContent = msg;
  errorToast.style.display = 'block';
  setTimeout(() => { errorToast.style.display = 'none'; }, 8000);
}

function showPerm(title, msg) {
  permScreen.classList.remove('hidden');
  permScreen.querySelector('.icon').textContent = '⚠️';
  permScreen.querySelector('h2').textContent = title;
  permScreen.querySelector('p').textContent  = msg;
  const btn = permScreen.querySelector('button');
  btn.textContent = 'Retry';
  btn.onclick = () => location.reload();
}
</script>
</body>
</html>
